name: CI

# Run this workflow when code is pushed to a branch.
# (Scoping to "branches" excludes tag pushes, which we don't need to build.)
on:
  push:
    branches: ["**"]

# Least privilege: this workflow reads code, pushes the built image to
# GHCR, and signs it keylessly via OIDC - nothing more.
permissions:
  contents: read
  packages: write   # push the image to GitHub Container Registry
  id-token: write   # request the short-lived OIDC token Cosign uses to sign

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # Fail fast instead of hanging until GitHub's default 6-hour limit
    # if a step (e.g. docker build/run) ever gets stuck.
    timeout-minutes: 10

    steps:
      # Check out the repository code so later steps can access it
      - name: Check out code
        uses: actions/checkout@v4

      # Build the Docker image from the Dockerfile in the repo root,
      # tagging it "mathutils" so we can refer to it in the next step
      - name: Build Docker image
        run: docker build -t mathutils .

      # Scan the image we just built for known vulnerabilities (CVEs) in
      # its OS packages and Python dependencies. exit-code: 1 makes this
      # step - and therefore the whole workflow - fail if any HIGH or
      # CRITICAL vulnerability is found. severity controls which levels
      # count; LOW/MEDIUM findings are ignored to keep this check focused.
      #
      # Pinned to a commit SHA (v0.35.0), not a version tag: in March 2026
      # trivy-action's tags were compromised and force-pushed to malicious
      # commits, so a tag reference is not trustworthy here. A commit SHA
      # cannot be silently moved the way a tag can.
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: mathutils
          severity: HIGH,CRITICAL
          exit-code: "1"
          # Only fail the build on vulnerabilities that actually have a
          # fix available. A HIGH/CRITICAL CVE with no upstream patch yet
          # isn't something we can act on, so failing over it just adds
          # noise without giving us a real next step.
          ignore-unfixed: "true"

      # Generate a Software Bill of Materials (SBOM) for the image using
      # Syft, via Anchore's official action. An SBOM is a complete
      # inventory of everything inside the image: the OS packages and
      # the Python packages, each with its exact name and version. The
      # action automatically uploads the result as a workflow artifact,
      # so it's downloadable from the run's summary page afterward.
      #
      # Pinned to a commit SHA (v0.24.0), following the same practice as
      # the Trivy step above.
      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: mathutils
          format: spdx-json
          artifact-name: sbom.spdx.json

      # Log in to GitHub Container Registry using the token GitHub already
      # provides this workflow - no extra secrets to create or manage.
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # Cosign signs an image by its content digest inside a registry, so
      # the image has to be pushed before it can be signed. Repo names can
      # contain uppercase letters, but registry paths can't, hence the
      # lowercasing. The digest (not just the tag) is captured because
      # that's what uniquely identifies exactly the bytes we're signing.
      - name: Push image to GHCR
        id: push
        run: |
          IMAGE="ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/mathutils"
          docker tag mathutils "$IMAGE:latest"
          docker push "$IMAGE:latest"
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE:latest")
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      # Install the Cosign CLI itself.
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Sign the pushed image "keylessly": instead of a private key we
      # manage, Cosign asks GitHub for a short-lived OIDC token proving
      # "this is workflow X in repo Y", trades it with Sigstore for a
      # certificate, and uses that to sign. The signature is stored back
      # in the registry next to the image - no separate file to track.
      - name: Sign the image with Cosign
        run: cosign sign --yes ${{ steps.push.outputs.digest }}

      # Prove the signature is real and actually verifiable: check it was
      # produced by this exact repository's GitHub Actions workflow via
      # Sigstore's public transparency log (Fulcio/Rekor), not just any
      # signature. This is the "demonstrate it can be verified" step.
      - name: Verify the image signature
        run: |
          cosign verify \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            ${{ steps.push.outputs.digest }}

      # Run the image. Its default CMD is "pytest", so this executes
      # the test suite inside the container. If any test fails, pytest
      # exits non-zero and this step (and the workflow) fails too.
      - name: Run tests
        run: docker run mathutils
