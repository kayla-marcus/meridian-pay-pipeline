name: CI

# Run this workflow when code is pushed to a branch.
# (Scoping to "branches" excludes tag pushes, which we don't need to build.)
on:
  push:
    branches: ["**"]

jobs:
  # This job is the CI "gate": build, scan for vulnerabilities, and test.
  # It runs on every branch and only ever needs read access to the repo -
  # it never touches the registry or a signing key, so it gets no elevated
  # permissions at all.
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Build Docker image
        run: docker build -t mathutils .

      # Scan for known vulnerabilities (CVEs) before anything else happens.
      # exit-code: 1 fails this step - and blocks every step after it,
      # including the test run - if a fixable HIGH/CRITICAL is found.
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: mathutils
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: "true"

      # Run the test suite. This happens BEFORE anything is published -
      # a broken build can no longer reach the registry.
      - name: Run tests
        run: docker run mathutils

      # Save the exact image we just built, scanned, and tested to a tar
      # file, then upload it as a short-lived workflow artifact. The
      # publish job runs on a separate, fresh runner and can't see this
      # job's Docker images otherwise - this hands off the literal tested
      # bytes instead of having publish rebuild from source and hope it
      # matches what was actually validated here.
      - name: Save image for publish job
        run: docker save mathutils -o mathutils.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: docker-image
          path: mathutils.tar
          retention-days: 1

  # This job only runs for pushes to main, and only starts once
  # build-and-test has fully succeeded (needs:). Feature branches can't
  # publish or sign anything, and nothing gets published until it's
  # actually passed scanning and tests. Elevated permissions (packages,
  # id-token) live only here, not on the whole workflow.
  publish:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write   # push the image to GitHub Container Registry
      id-token: write   # request the short-lived OIDC token Cosign uses to sign

    steps:
      - name: Check out code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      # Download the exact image build-and-test already built, scanned,
      # and tested - no rebuild, so what gets pushed and signed is
      # provably the same bytes that passed the gate job, not just "the
      # same source, probably".
      - name: Download image artifact
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: docker-image

      - name: Load image
        run: docker load -i mathutils.tar

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push image to GHCR
        id: push
        run: |
          IMAGE="ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/mathutils"
          docker tag mathutils "$IMAGE:latest"
          docker push "$IMAGE:latest"
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE:latest")
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      # Generate the SBOM from the image reference actually pushed to the
      # registry (not the local build), so it's describing the exact
      # digest that gets signed below, not just "an image that should be
      # the same". output-file writes the SBOM to disk so the next step
      # (cosign attest) can attach it to the image directly.
      - name: Generate SBOM
        id: sbom
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ steps.push.outputs.digest }}
          format: spdx-json
          artifact-name: sbom.spdx.json
          output-file: sbom.spdx.json

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the image with Cosign
        run: cosign sign --yes ${{ steps.push.outputs.digest }}

      # Attach the SBOM to the image itself as a signed attestation,
      # rather than leaving it as a loose, unrelated workflow artifact.
      # This cryptographically binds "here's what's inside this image"
      # to the same digest the signature above covers, so a consumer can
      # verify the SBOM actually describes this exact published image.
      - name: Attest the SBOM to the image
        run: cosign attest --yes --type spdxjson --predicate sbom.spdx.json ${{ steps.push.outputs.digest }}

      - name: Verify the image signature
        run: |
          cosign verify \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            ${{ steps.push.outputs.digest }}

      # Verify the SBOM attestation the same way - confirms it's both
      # present and genuinely signed by this repository's workflow.
      - name: Verify the SBOM attestation
        run: |
          cosign verify-attestation \
            --type spdxjson \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            ${{ steps.push.outputs.digest }}
