name: CI

# Run this workflow when code is pushed to a branch.
# (Scoping to "branches" excludes tag pushes, which we don't need to build.)
on:
  push:
    branches: ["**"]

# Least privilege: this workflow only reads code and runs a local Docker
# build/test, so it never needs write access to the repository.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # Fail fast instead of hanging until GitHub's default 6-hour limit
    # if a step (e.g. docker build/run) ever gets stuck.
    timeout-minutes: 10

    steps:
      # Check out the repository code so later steps can access it
      - name: Check out code
        uses: actions/checkout@v4

      # Build the Docker image from the Dockerfile in the repo root,
      # tagging it "mathutils" so we can refer to it in the next step
      - name: Build Docker image
        run: docker build -t mathutils .

      # Scan the image we just built for known vulnerabilities (CVEs) in
      # its OS packages and Python dependencies. exit-code: 1 makes this
      # step - and therefore the whole workflow - fail if any HIGH or
      # CRITICAL vulnerability is found. severity controls which levels
      # count; LOW/MEDIUM findings are ignored to keep this check focused.
      #
      # Pinned to a commit SHA (v0.35.0), not a version tag: in March 2026
      # trivy-action's tags were compromised and force-pushed to malicious
      # commits, so a tag reference is not trustworthy here. A commit SHA
      # cannot be silently moved the way a tag can.
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: mathutils
          severity: HIGH,CRITICAL
          exit-code: "1"
          # Only fail the build on vulnerabilities that actually have a
          # fix available. A HIGH/CRITICAL CVE with no upstream patch yet
          # isn't something we can act on, so failing over it just adds
          # noise without giving us a real next step.
          ignore-unfixed: "true"

      # Generate a Software Bill of Materials (SBOM) for the image using
      # Syft, via Anchore's official action. An SBOM is a complete
      # inventory of everything inside the image: the OS packages and
      # the Python packages, each with its exact name and version. The
      # action automatically uploads the result as a workflow artifact,
      # so it's downloadable from the run's summary page afterward.
      #
      # Pinned to a commit SHA (v0.24.0), following the same practice as
      # the Trivy step above.
      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: mathutils
          format: spdx-json
          artifact-name: sbom.spdx.json

      # Run the image. Its default CMD is "pytest", so this executes
      # the test suite inside the container. If any test fails, pytest
      # exits non-zero and this step (and the workflow) fails too.
      - name: Run tests
        run: docker run mathutils
