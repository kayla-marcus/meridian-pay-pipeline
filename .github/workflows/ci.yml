name: CI

# Run this workflow when code is pushed to a branch.
# (Scoping to "branches" excludes tag pushes, which we don't need to build.)
on:
  push:
    branches: ["**"]

# Least privilege: this workflow only reads code and runs a local Docker
# build/test, so it never needs write access to the repository.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # Fail fast instead of hanging until GitHub's default 6-hour limit
    # if a step (e.g. docker build/run) ever gets stuck.
    timeout-minutes: 10

    steps:
      # Check out the repository code so later steps can access it
      - name: Check out code
        uses: actions/checkout@v4

      # Build the Docker image from the Dockerfile in the repo root,
      # tagging it "mathutils" so we can refer to it in the next step
      - name: Build Docker image
        run: docker build -t mathutils .

      # Scan the image we just built for known vulnerabilities (CVEs) in
      # its OS packages and Python dependencies. exit-code: 1 makes this
      # step - and therefore the whole workflow - fail if any HIGH or
      # CRITICAL vulnerability is found. severity controls which levels
      # count; LOW/MEDIUM findings are ignored to keep this check focused.
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: mathutils
          severity: HIGH,CRITICAL
          exit-code: "1"

      # Run the image. Its default CMD is "pytest", so this executes
      # the test suite inside the container. If any test fails, pytest
      # exits non-zero and this step (and the workflow) fails too.
      - name: Run tests
        run: docker run mathutils
